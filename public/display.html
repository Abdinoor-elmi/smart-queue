<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartQueue - Counter Display</title>
    <link rel="stylesheet" href="css/main.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #102a43;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
        }

        .display-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
        }

        .display-header {
            text-align: center;
            margin-bottom: 1rem;
        }

        .display-title {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 0.35rem;
        }

        .display-subtitle {
            font-size: 1.125rem;
            opacity: 0.9;
        }

        .board-summary {
            display: flex;
            justify-content: center;
            gap: 2rem;
            padding: 0.75rem 1rem;
            margin-bottom: 1rem;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 0.5rem;
        }

        .summary-value {
            font-size: 1.5rem;
            font-weight: 800;
            text-align: center;
        }

        .summary-label {
            font-size: 0.8rem;
            opacity: 0.78;
            text-align: center;
            text-transform: uppercase;
        }

        .counter-board {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1rem;
            min-height: 0;
        }

        .counter-column {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 0.75rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }

        .counter-header {
            background: rgba(255, 255, 255, 0.14);
            padding: 1rem;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.16);
        }

        .counter-name {
            font-size: 1.5rem;
            font-weight: 800;
        }

        .counter-service {
            margin-top: 0.25rem;
            font-size: 0.95rem;
            opacity: 0.82;
        }

        .counter-tickets {
            flex: 1;
            overflow-y: auto;
            padding: 0.75rem;
        }

        .ticket-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.75rem;
            padding: 0.85rem 1rem;
            background: rgba(255, 255, 255, 0.95);
            color: #102a43;
            border-radius: 0.5rem;
            margin-bottom: 0.65rem;
            border-left: 6px solid #94a3b8;
        }

        .ticket-row.waiting {
            border-left-color: #f59e0b;
            background: #fef3c7;
        }

        .ticket-row.called {
            border-left-color: #3b82f6;
            background: #dbeafe;
        }

        .ticket-row.serving {
            border-left-color: #10b981;
            background: #d1fae5;
        }

        .ticket-left {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            min-width: 0;
        }

        .ticket-sequence {
            width: 2rem;
            height: 2rem;
            border-radius: 999px;
            background: rgba(16, 42, 67, 0.12);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            flex: 0 0 auto;
        }

        .ticket-number {
            font-size: 1.45rem;
            font-weight: 900;
            line-height: 1;
        }

        .ticket-time {
            margin-top: 0.25rem;
            font-size: 0.8rem;
            color: #486581;
        }

        .ticket-state {
            border-radius: 999px;
            padding: 0.35rem 0.7rem;
            font-size: 0.8rem;
            font-weight: 800;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .ticket-state.waiting {
            background: #92400e;
            color: white;
        }

        .ticket-state.called {
            background: #1d4ed8;
            color: white;
        }

        .ticket-state.serving {
            background: #047857;
            color: white;
        }

        .no-queue {
            text-align: center;
            padding: 2rem 1rem;
            opacity: 0.75;
        }

        .display-footer {
            text-align: center;
            margin-top: 1rem;
            opacity: 0.75;
        }

        .display-sound-btn {
            margin-bottom: 0.65rem;
            background: #f8fafc;
            color: #102a43;
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 999px;
            padding: 0.55rem 1rem;
            font-weight: 800;
            cursor: pointer;
        }

        .display-sound-btn.enabled {
            display: none;
        }

        .time-display {
            font-size: 1rem;
            margin-bottom: 0.25rem;
        }

        @media (max-width: 768px) {
            body {
                overflow: auto;
            }

            .display-container {
                height: auto;
                min-height: 100vh;
                padding: 1rem;
            }

            .display-title {
                font-size: 2rem;
            }

            .board-summary {
                gap: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="display-container">
        <div class="display-header">
            <h1 class="display-title">SmartQueue</h1>
            <p class="display-subtitle">Counter Queue Display</p>
        </div>

        <div class="board-summary">
            <div>
                <div class="summary-value" id="total-waiting">0</div>
                <div class="summary-label">Waiting to be Called</div>
            </div>
            <div>
                <div class="summary-value" id="total-called">0</div>
                <div class="summary-label">Called</div>
            </div>
            <div>
                <div class="summary-value" id="total-serving">0</div>
                <div class="summary-label">Being Served</div>
            </div>
        </div>

        <div class="counter-board" id="counter-board">
            <div class="no-queue">Loading counters...</div>
        </div>

        <div class="display-footer">
            <button id="enable-sound-btn" class="display-sound-btn" type="button">Enable Sound</button>
            <div class="time-display" id="current-time"></div>
            <p>Last updated: <span id="last-updated">Never</span></p>
        </div>
    </div>

    <script src="js/display.js"></script>
</body>
</html>
