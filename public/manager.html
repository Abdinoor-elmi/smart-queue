<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartQueue - Manager Reports</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/manager.css">
</head>
<body class="manager-page">
    <div class="admin-container manager-container">
        <div class="admin-main" id="manager-main">
            <div class="admin-header manager-header">
                <div class="admin-header-content">
                    <div>
                        <h1>Manager Reports</h1>
                        <p class="manager-subtitle">Build focused queue, counter, service, no-show, and cancellation reports.</p>
                    </div>
                    <div class="admin-actions">
                        <span class="manager-user-chip" id="manager-user">Manager</span>
                        <button id="logout-btn" class="btn btn-danger">Logout</button>
                    </div>
                </div>
            </div>

            <div class="admin-content">
                <div class="form-container manager-report-card">
                    <div class="form-header">
                        <div>
                            <div class="form-title">Request Report</div>
                            <p class="form-helper">Choose one report and narrow it by date, service, or counter.</p>
                        </div>
                    </div>
                    <form id="report-form">
                        <div class="manager-filter-grid">
                            <div class="form-group report-type-field">
                                <label class="form-label">Report Type</label>
                                <select class="form-control" id="report-type" required>
                                    <option value="summary">Summary</option>
                                    <option value="queue">Active Queue</option>
                                    <option value="service">Service Performance</option>
                                    <option value="counter">Counter Activity</option>
                                    <option value="peak">Peak Hours</option>
                                    <option value="noshow">No-Show Report</option>
                                    <option value="tickets">Ticket Details</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label">From Date</label>
                                <input type="date" class="form-control" id="from-date">
                            </div>
                            <div class="form-group">
                                <label class="form-label">To Date</label>
                                <input type="date" class="form-control" id="to-date">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Service</label>
                                <select class="form-control" id="service-filter">
                                    <option value="all">All Services</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Counter</label>
                                <select class="form-control" id="counter-filter">
                                    <option value="all">All Counters</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-actions manager-actions">
                            <button type="button" class="btn btn-secondary" id="reset-report-btn">Reset</button>
                            <button type="button" class="btn btn-success" id="export-report-btn" disabled>Export CSV</button>
                            <button type="button" class="btn btn-secondary" id="export-pdf-btn" disabled>Export PDF</button>
                            <button type="submit" class="btn btn-primary">Generate Report</button>
                        </div>
                    </form>
                </div>

                <div class="chart-container manager-output" id="report-output">
                    <div class="chart-header">
                        <div class="chart-title">Report Output</div>
                    </div>
                    <div class="chart-content">
                        <div class="empty-report-state">
                            <div class="empty-report-title">No report generated yet</div>
                            <p>Choose a report type and click Generate Report.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="login-modal" class="modal show">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Manager Login</h2>
            </div>
            <div class="modal-body">
                <form id="login-form">
                    <div class="form-group">
                        <label class="form-label">Username</label>
                        <input type="text" id="username" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <input type="password" id="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Login</button>
                </form>
            </div>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/manager.js"></script>
</body>
</html>
